apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickify-backend
  namespace: tickify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tickify-backend
  template:
    metadata:
      labels:
        app: tickify-backend
    spec:
      containers:
        - name: backend
          image: bhagyaekanayake/tickify-backend:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: tickify-config
            - secretRef:
                name: tickify-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: tickify-backend
  namespace: tickify
spec:
  type: ClusterIP
  selector:
    app: tickify-backend
  ports:
    - port: 3000
      targetPort: 3000
