apiVersion: v1
kind: Secret
metadata:
  name: tickify-secrets
  namespace: tickify
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "tickifyadmin"
  MONGO_INITDB_ROOT_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  URI: "mongodb://tickifyadmin:CHANGE_ME_STRONG_PASSWORD@tickify-mongodb:27017/tickify?authSource=admin"
  REDIS_URL: "redis://tickify-redis:6379"
  SECRET_ACCESS_TOKEN: "CHANGE_ME_ACCESS_TOKEN_SECRET"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
  MOCK_PAYMENT_SECRET: "CHANGE_ME_PAYMENT_SECRET"
  ENCRYPTION_MASTER_KEY: "CHANGE_ME_64_CHAR_HEX_KEY"
  RSA_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_YOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
  RSA_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nREPLACE_WITH_YOUR_PUBLIC_KEY\n-----END PUBLIC KEY-----\n"
