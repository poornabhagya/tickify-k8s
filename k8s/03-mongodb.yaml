apiVersion: v1
kind: Service
metadata:
  name: tickify-mongodb
  namespace: tickify
spec:
  selector:
    app: tickify-mongodb
  ports:
    - port: 27017
      targetPort: 27017
  clusterIP: None # Headless Service for StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tickify-mongodb
  namespace: tickify
spec:
  serviceName: "tickify-mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: tickify-mongodb
  template:
    metadata:
      labels:
        app: tickify-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tickify-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tickify-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: tickify-config
                  key: MONGO_INITDB_DATABASE
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
